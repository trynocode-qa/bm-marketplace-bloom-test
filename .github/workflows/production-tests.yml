name: Production tests (NPR UI)

# Each run creates and SUBMITS real New Project Requests in the target environment,
# so the workflow runs on demand only. Uncomment `schedule` for a nightly run once agreed with the client.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 1 * * 1-5"   # 01:30 UTC, Monday-Friday

# Never run two submissions against the environment at the same time.
concurrency:
  group: production-tests
  cancel-in-progress: false

jobs:
  npr-ui-tests:
    name: NPR UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEADLESS: "true"
      BASE_URL: ${{ vars.BASE_URL || 'https://test.bloom.engineering' }}
      # Credentials default to framework/data/test_data.py; no secrets needed.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run NPR UI tests
        run: python -m pytest production-tests/NPR-UI -v

      # ---------- Reporting (runs even when tests fail) ----------
      - name: Set up Java for Allure
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure HTML report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload raw Allure results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-and-traces
          path: |
            allure-results
            test-results
          retention-days: 14
          if-no-files-found: ignore
