[pytest]
testpaths = tests production-tests
pythonpath = .
python_files = test_*.py
addopts =
    -ra
    --alluredir=allure-results
    --clean-alluredir
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results
markers =
    smoke: quick critical-path checks
    regression: full regression suite
    ui: browser (UI) tests
    api: API tests
log_cli = false
log_level = INFO
